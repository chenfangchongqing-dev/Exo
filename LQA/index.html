
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>第1期｜游戏本地化LQA工作坊入口</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --soft: #eff6ff;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      overflow-x: hidden;
    }
    .wrap {
      width: min(1320px, 96vw);
      min-height: 100vh;
      margin: 0 auto;
      padding: 22px 0 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    header {
      text-align: center;
      margin-bottom: 22px;
      flex: 0 0 auto;
    }
    .tag {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      background: #e0ecff;
      color: #1d4ed8;
      font-weight: 800;
      font-size: clamp(13px, 1.15vw, 16px);
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 4.3vw, 60px);
      line-height: 1.08;
      letter-spacing: .02em;
      font-weight: 950;
    }
    .subtitle {
      margin-top: 10px;
      color: var(--muted);
      font-size: clamp(21px, 2.25vw, 32px);
      font-weight: 850;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.06fr .94fr;
      gap: 24px;
      align-items: stretch;
      flex: 1 1 auto;
      min-height: 0;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 24px 30px;
      box-shadow: 0 10px 28px rgba(31, 41, 55, .07);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .step {
      color: var(--primary);
      font-weight: 950;
      font-size: clamp(17px, 1.55vw, 22px);
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    h2 {
      margin: 0 0 10px;
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1.2;
      font-weight: 950;
    }
    p {
      margin: 0 0 12px;
      font-size: clamp(17px, 1.5vw, 22px);
      font-weight: 750;
    }
    .checkin-note {
      color: #374151;
      margin-bottom: 14px;
    }
    .qr-wrap {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 2px;
    }
    .qr-wrap img {
      width: min(100%, 520px);
      max-height: 54vh;
      object-fit: contain;
      border-radius: 18px;
      border: 1px solid var(--line);
      box-shadow: 0 10px 28px rgba(31, 41, 55, .09);
      background: #fff;
    }
    .right-card {
      gap: 18px;
    }
    .mini-section {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px 22px;
      background: #fff;
    }
    .mini-section.highlight {
      background: var(--soft);
      border-color: #bfdbfe;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .step-title-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }
    .app-icon {
      width: clamp(46px, 5vw, 68px);
      height: clamp(46px, 5vw, 68px);
      border-radius: 15px;
      object-fit: cover;
      box-shadow: 0 6px 18px rgba(31, 41, 55, .10);
      flex: 0 0 auto;
    }
    .mini-section h2 {
      font-size: clamp(25px, 2.55vw, 36px);
      margin-bottom: 8px;
    }
    .group-qr-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 8px;
    }
    .group-qr-wrap img {
      width: min(100%, 320px);
      max-height: 34vh;
      object-fit: contain;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 10px;
      box-shadow: 0 8px 22px rgba(31, 41, 55, .08);
    }
    .footer {
      margin-top: 16px;
      color: var(--muted);
      font-size: clamp(16px, 1.35vw, 20px);
      text-align: center;
      font-weight: 800;
      flex: 0 0 auto;
    }
    @media (max-width: 900px) {
      .wrap {
        justify-content: flex-start;
        padding: 24px 0 40px;
      }
      .grid { grid-template-columns: 1fr; }
      .qr-wrap img {
        width: min(100%, 420px);
        max-height: none;
      }
      .group-qr-wrap img {
        width: min(100%, 300px);
        max-height: none;
      }
    }
    @media (min-width: 901px) and (max-height: 820px) {
      .wrap { padding-top: 14px; padding-bottom: 14px; }
      header { margin-bottom: 12px; }
      .card { padding-top: 18px; padding-bottom: 18px; }
      .qr-wrap img { max-height: 50vh; width: min(100%, 470px); }
      .group-qr-wrap img { max-height: 30vh; width: min(100%, 280px); }
      .mini-section { padding-top: 16px; padding-bottom: 16px; }
      .footer { margin-top: 10px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="tag">翻译项目管理与本地化系列工作坊</div>
      <h1>第1期｜游戏本地化LQA工作坊</h1>
      <div class="subtitle">请按照顺序完成签到、下载飞书 App 并加入工作坊群</div>
    </header>

    <section class="grid">
      <div class="card">
        <div class="step">Step 1</div>
        <h2>微信扫码签到</h2>
        <p class="checkin-note">请使用微信扫码填写现场签到表，并填写报名时使用的真实姓名和手机号。</p>
        <div class="qr-wrap">
          <img src="checkin.png" alt="现场签到二维码">
        </div>
      </div>

      <div class="card right-card">
        <div class="mini-section">
          <div class="step-title-row">
            <div>
              <div class="step">Step 2</div>
              <h2>手机应用商店下载“飞书”App</h2>
            </div>
            <img class="app-icon" src="feishu_icon.png" alt="飞书 App 图标">
          </div>
          <p>请在手机应用商店搜索并下载“飞书”App。已安装的同学可直接进入下一步。</p>
        </div>

        <div class="mini-section highlight">
          <div class="step">Step 3</div>
          <h2>加入LQA工作坊飞书群</h2>
          <p>扫码加入工作坊飞书群。无飞书账号的同学，请根据页面提示使用手机号注册/登录。</p>
          <div class="group-qr-wrap">
            <img src="feishu_group_qr.png" alt="LQA工作坊飞书群二维码">
          </div>
        </div>
      </div>
    </section>

    <div class="footer">
      如遇签到、下载、注册或加群问题，请联系现场工作人员。
    </div>
  </main>
</body>
</html>
