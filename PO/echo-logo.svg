<svg xmlns="http://www.w3.org/2000/svg" viewBox="45 40 650 430" role="img" aria-labelledby="name">
<title id="name">Écho. — calligraphie fidèle au dessin de référence</title>
<style><![CDATA[
/* The three rays on the left are entirely static. */
@keyframes waveNear {
  0%,7%,90%,100% { opacity:0; }
  12%,77% { opacity:1; }
}
@keyframes waveMiddle {
  0%,23%,90%,100% { opacity:0; }
  29%,77% { opacity:1; }
}
@keyframes waveFar {
  0%,41%,90%,100% { opacity:0; }
  47%,77% { opacity:1; }
}
.sound-wave-one { animation: waveNear 3s ease-in-out infinite; }
.sound-wave-two { animation: waveMiddle 3s ease-in-out infinite; }
.sound-wave-three { animation: waveFar 3s ease-in-out infinite; }
@media(prefers-reduced-motion:reduce){.sound-wave-one,.sound-wave-two,.sound-wave-three{animation:none!important;opacity:1!important;}}
]]></style>
