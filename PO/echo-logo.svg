<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 33 235 83" role="img" aria-labelledby="title desc">
<title id="title">écho. — écriture à la main</title>
<desc id="desc">Le nom écho tracé à la main en vert, suivi de trois ondes sonores simples.</desc>
<style><![CDATA[
/* Deliberately restrained: handwritten strokes stay still; only the sound waves breathe. */
@keyframes echoRipple {
  0%, 12%, 100% { opacity: .33; }
  27%, 51% { opacity: 1; }
  72% { opacity: .45; }
}
.wave { animation: echoRipple 2.8s ease-in-out infinite; }
.wave-one { animation-delay: 0s; }
.wave-two { animation-delay: .28s; }
.wave-three { animation-delay: .56s; }
@media(prefers-reduced-motion:reduce) {
  .wave { animation:none!important; opacity:1!important; }
}
]]></style>
<!-- Vector handwriting, no font dependency and no subtitle. -->
<g fill="none" stroke="#1d694d" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
<path d="M31 80 C43 82 55 77 53 70 C51 62 40 65 36 73 C28 87 35 96 46 94 C53 93 59 88 62 83"/>
<path d="M43 59 L53 49" stroke-width="3"/>
<path d="M91 69 C82 63 72 66 68 75 C62 90 75 98 90 88"/>
<path d="M98 93 C103 73 109 52 111 43 M104 81 C114 68 127 65 132 72 C136 79 127 88 130 93"/>
<path d="M158 68 C144 63 137 73 139 84 C140 97 157 99 164 86 C170 77 164 68 158 68Z"/>
<path d="M181 91 L182 91" stroke-width="5.1"/>
</g>
<!-- Three spare, handwritten sound marks. -->
<g fill="none" stroke-linecap="round" stroke-width="3.3">
<path class="wave wave-one" d="M201 65 Q210 80 201 94" stroke="#43a67b"/>
<path class="wave wave-two" d="M211 59 Q224 80 211 100" stroke="#80c39c"/>
<path class="wave wave-three" d="M223 55 Q240 80 223 105" stroke="#b5dbc3"/>
</g>
</svg>