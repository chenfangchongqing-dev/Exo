name = "inspire4-glm-compagnon"
main = "worker.js"
compatibility_date = "2026-11-06"
workers_dev = true

# Public/non-sensitive settings only. Secrets must NOT appear here.
[vars]
GLM_MODEL = "glm-4.7-flash"
ALLOWED_ORIGIN = "https://chenfangchongqing-dev.github.io"

# Cloudflare's approximate per-location limiter (not a strict billing cap).
[[ratelimits]]
name = "REQUEST_LIMITER"
namespace_id = "247001"

  [ratelimits.simple]
  limit = 120
  period = 60
