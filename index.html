<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>互动法语练习平台</title>
<style>
  :root{ --ink:#0f172a; --muted:#64748b; --bg:#f7f7fb; --surface:#ffffff; --shadow:0 16px 40px rgba(2,6,23,.08);}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
  .wrap{max-width:1100px;margin:0 auto;padding:28px}
  .hero{position:relative;border-radius:20px;padding:48px 28px;overflow:hidden;
         background:radial-gradient(1200px 500px at -10% -20%, #e0e7ff 0, transparent 50%),
                    radial-gradient(900px 400px at 110% 10%, #cffafe 0, transparent 50%), #ffffff;
         border:1px solid #e5e7eb;box-shadow:var(--shadow)}
  .hero h1{font-size:2rem;margin:0 0 8px}
  .hero p{margin:0;color:#64748b}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:20px}
  a.card{display:block;border-radius:16px;padding:18px 18px 20px;text-decoration:none;color:#0f172a;
          background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.06);border:1px solid #eaeef3}
  a.card .tag{font-weight:700;display:flex;flex-direction:column;align-items:flex-start;gap:4px;opacity:.92;line-height:1.4}
  a.card .zh,a.card .fr{display:block}
  a.card{min-height:98px;box-sizing:border-box}
  a.card:hover{transform:translateY(-2px);box-shadow:0 16px 36px rgba(0,0,0,.08)}
  .teacher-entry{margin:23px 1px 0;padding-top:14px;border-top:1px solid #e5e7eb;text-align:right;font-size:13px;color:#64748b}
  .teacher-entry a{color:inherit;text-decoration:none}
  .teacher-entry a:hover,.teacher-entry a:focus-visible{text-decoration:underline;color:#334155}
  footer{margin-top:22px;color:#64748b}
</style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>互动法语练习平台</h1>
      <p>选择模块进入练习。支持在各模块中按单元建文件夹（U1…U9），并在目录页搜索/筛选。</p>
      <div class="grid">
        <a class="card" href="./Vocabulaire/"><span class="tag" style="color:#2563eb"><span class="zh">词汇</span><span class="fr" lang="fr">Vocabulaire</span></span></a><a class="card" href="./Grammaire/"><span class="tag" style="color:#16a34a"><span class="zh">语法</span><span class="fr" lang="fr">Grammaire</span></span></a><a class="card" href="./CO/"><span class="tag" style="color:#f59e0b"><span class="zh">听力</span><span class="fr" lang="fr">Écouter et apprendre</span></span></a><a class="card" href="./CE/"><span class="tag" style="color:#a855f7"><span class="zh">阅读</span><span class="fr" lang="fr">Lire et apprendre</span></span></a><a class="card" href="./PE/">
  <span class="tag" style="color:#ef4444"><span class="zh">写作</span><span class="fr" lang="fr">Écrire</span></span>
</a>
<a class="card" href="./PO/">
  <span class="tag" style="color:#475569"><span class="zh">口语</span><span class="fr" lang="fr">Parler et interagir</span></span>
</a>
<a class="card" href="./Agir/">
  <span class="tag" style="color:#0ea5e9"><span class="zh">行动</span><span class="fr" lang="fr">Agir</span></span>
</a>
<a class="card" href="./Decodage/">
  <span class="tag" style="color:#4f46e5"><span class="zh">文化解读</span><span class="fr" lang="fr">Regards croisés</span></span>
</a>
      </div>
      <div class="teacher-entry"><a href="./Events/" aria-label="进入教师专用的教学研讨与临时活动">教学研讨与临时活动 <span lang="fr">· Espace enseignant</span> ↗</a></div>
    </section>
    <footer>© 《高级法语综合课》</footer>
  </div>
</body>
</html>
