<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>互动法语练习平台</title>
<style>
  :root{ --ink:#0f172a; --muted:#64748b; --bg:#f7f7fb; --surface:#ffffff; --shadow:0 16px 40px rgba(2,6,23,.08);}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
  .wrap{max-width:1320px;margin:0 auto;padding:28px}
  .hero{position:relative;border-radius:20px;padding:48px 28px;overflow:hidden;
         background:radial-gradient(1200px 500px at -10% -20%, #e0e7ff 0, transparent 50%),
                    radial-gradient(900px 400px at 110% 10%, #cffafe 0, transparent 50%), #ffffff;
         border:1px solid #e5e7eb;box-shadow:var(--shadow)}
  .hero h1{font-size:2rem;margin:0 0 8px}
  .hero p{margin:0;color:#64748b}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:24px}
  a.card{display:flex;align-items:flex-start;border-radius:14px;padding:23px 17px 19px;text-decoration:none;color:var(--ink);
          background:#fff;box-shadow:0 5px 18px rgba(24,36,50,.035);border:1px solid #e5e9eb;
          min-height:120px;box-sizing:border-box;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
  a.card .tag{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;
              gap:6px;min-width:0;width:100%;padding-left:14px;border-left:4px solid var(--accent,#96a9aa)}
  a.card .zh{display:block;font-family:KaiTi,"STKaiti","Kaiti SC","楷体",serif;
             font-size:16px;font-weight:400;line-height:1.45;letter-spacing:.07em;color:#737d84}
  a.card .fr{display:block;min-width:0;font:600 21px/1.3 Arial,Helvetica,sans-serif;
             color:var(--accent-text,#3b526d);white-space:nowrap;overflow-wrap:normal;word-break:normal;hyphens:none}
  a.card:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(24,36,50,.065);border-color:#cdd6d9}
  a.card:focus-visible{outline:3px solid #6e96e6;outline-offset:3px}
  @media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:560px){.wrap{padding:16px}.hero{padding:30px 18px}.grid{grid-template-columns:1fr;gap:12px}
    a.card{min-height:112px;padding:22px 19px}a.card .fr{font-size:21px;white-space:normal}}
  .teacher-entry{margin:23px 1px 0;padding-top:14px;border-top:1px solid #e5e7eb;text-align:right;font-size:13px;color:#64748b}
  .teacher-entry a{color:inherit;text-decoration:none}
  .teacher-entry a:hover,.teacher-entry a:focus-visible{text-decoration:underline;color:#334155}
  footer{margin-top:22px;color:#64748b}
</style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>互动法语练习平台</h1>
      <p>选择模块进入练习。支持在各模块中按单元建文件夹（U1…U9），并在目录页搜索/筛选。</p>
      <div class="grid">
        <a class="card" href="./Vocabulaire/"><span class="tag" style="--accent:#7897c1;--accent-text:#315e99"><span class="zh">词汇</span><span class="fr" lang="fr">Vocabulaire</span></span></a><a class="card" href="./Grammaire/"><span class="tag" style="--accent:#86ab90;--accent-text:#397752"><span class="zh">语法</span><span class="fr" lang="fr">Grammaire</span></span></a><a class="card" href="./CO/"><span class="tag" style="--accent:#d3a159;--accent-text:#a26516"><span class="zh">听力</span><span class="fr" lang="fr">Écouter et&nbsp;apprendre</span></span></a><a class="card" href="./CE/"><span class="tag" style="--accent:#a78ac5;--accent-text:#7854a0"><span class="zh">阅读</span><span class="fr" lang="fr">Lire et&nbsp;apprendre</span></span></a><a class="card" href="./PE/">
  <span class="tag" style="--accent:#c88b88;--accent-text:#a34d50"><span class="zh">写作</span><span class="fr" lang="fr">Écrire</span></span>
</a>
<a class="card" href="./PO/">
  <span class="tag" style="--accent:#8d9eb2;--accent-text:#4a6079"><span class="zh">口语</span><span class="fr" lang="fr">Parler et&nbsp;interagir</span></span>
</a>
<a class="card" href="./Agir/">
  <span class="tag" style="--accent:#77adbd;--accent-text:#257b94"><span class="zh">行动</span><span class="fr" lang="fr">Agir</span></span>
</a>
<a class="card" href="./Decodage/">
  <span class="tag" style="--accent:#9387c5;--accent-text:#6254a4"><span class="zh">文化解读</span><span class="fr" lang="fr">Regards croisés</span></span>
</a>
      </div>
      <div class="teacher-entry"><a href="./Events/" aria-label="进入教师专用的教学研讨与临时活动">教学研讨与临时活动 <span lang="fr">· Espace enseignant</span> ↗</a></div>
    </section>
    <footer>© 《高级法语综合课》</footer>
  </div>
</body>
</html>
