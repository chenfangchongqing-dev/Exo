name: Publish Inspire 4 U1 listening audio

on:
  push:
    paths:
      - ".github/workflows/publish-co-u1-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve and verify track from the official publisher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p CO/U1
          curl --fail --location --silent --show-error --retry 3 --retry-delay 4 --connect-timeout 30 --max-time 180 \
            --user-agent "Mozilla/5.0" \
            --output CO/U1/INSP_4_CA_Piste02.mp3 \
            "https://inspire.hachettefle.fr/dl.php?f=ressources/INSP4_CA_AUDIO/INSP_4_CA_Piste02.mp3"
          echo "1a8ac0437e86740fe07079d24502fb8de4848c06fac97c9afd3fb2668d3aeb40  CO/U1/INSP_4_CA_Piste02.mp3" | sha256sum --check
          test "$(wc -c < CO/U1/INSP_4_CA_Piste02.mp3)" -eq 3553930
      - name: Commit the verified audio to GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CO/U1/INSP_4_CA_Piste02.mp3
          if git diff --cached --quiet; then echo "Audio is already up to date"; exit 0; fi
          git commit -m "Host original Inspire 4 CA piste 02 audio"
          git push origin HEAD:main
