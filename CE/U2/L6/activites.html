<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#52aa80"><title>Activités · L’homme réparé du futur</title><style>:root{--deep:#173e30;--green:#2f8059;--mint:#5ba982;--line:#c7dfd0;--bg:#f6faf7;--paper:#fff;--muted:#5c7263}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:18px/1.65 Arial,Helvetica,sans-serif;color:var(--deep)}.wrap{max-width:970px;padding:22px 22px 80px;margin:auto}.top{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:16px;margin:0 0 24px;font-size:15px}.top a{color:var(--green);text-decoration:none;font-weight:800}.hero{border-radius:22px;padding:33px 42px;background:linear-gradient(110deg,#5caf83,#d9f0e0);margin-bottom:23px}.kicker{font-size:13px;letter-spacing:.13em;font-weight:800;color:#145039;margin:0 0 8px}h1{font-size:clamp(33px,4vw,50px);line-height:1.13;margin:0 0 12px}.hero p:last-child{font:22px/1.55 "Times New Roman",serif;margin:0}.panel{border:1px solid var(--line);background:var(--paper);padding:28px 32px;margin:20px 0;border-radius:20px;box-shadow:0 7px 28px #214d2c0b}.panel h2{font-size:25px;margin:0 0 10px}.panel h3{font-size:20px;margin:22px 0 10px}.hint{color:var(--muted);font-size:15px}.options{display:grid;gap:10px;margin:15px 0}.option{display:flex;gap:13px;align-items:start;padding:13px 16px;background:#f8fbf9;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:18px}.option input{width:20px;height:20px;accent-color:var(--green);margin-top:7px}.field{display:block;margin:16px 0}.field span{font-size:17px;font-weight:700;display:block;margin-bottom:8px}.field textarea,.field select,.field input{width:100%;border:1px solid #b7cfc0;border-radius:10px;background:white;padding:11px 12px;font:18px/1.45 "Times New Roman",serif;color:#203e2c;min-height:48px}.field textarea{min-height:100px;resize:vertical}button{font:700 16px Arial;cursor:pointer}.primary{border:0;border-radius:12px;background:var(--green);color:white;padding:13px 22px;min-height:46px}.second{border:1px solid var(--line);border-radius:12px;background:white;color:var(--green);padding:12px 19px}.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px}.answer{display:none;border:1px solid #a9d2b5;background:#edf8f0;border-radius:13px;padding:18px 20px;margin:18px 0}.answer.show{display:block}.answer h3{margin:0 0 8px;font-size:19px}.answer p{margin:7px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.grid .field{margin:0}.feedback{font-size:15px;color:#41664c;margin:13px 0}.footnav{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.footnav a{padding:13px 17px;background:white;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--green);font-weight:700;font-size:16px}.footnav .next{background:var(--green);color:#fff}.eyelevel{font-size:15px;font-weight:800;color:var(--green);letter-spacing:.06em}.timeline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#f2f8f4;padding:17px 20px;border-radius:14px}.timeline span{background:white;border:1px solid var(--line);padding:8px 12px;border-radius:11px}.timeline b{color:var(--green)}@media(max-width:640px){.wrap{padding:15px 13px 50px}.hero{padding:27px 24px}.panel{padding:20px 18px}.grid{grid-template-columns:1fr}h1{font-size:33px}}</style></head><body><main class="wrap"><nav class="top"><a id="backtop" href="./index.html">← Revenir au texte</a><a href="./index.html">LEÇON 6 · DOCUMENT 3</a></nav><header class="hero"><p class="kicker" id="kicker">COMPRÉHENSION ÉCRITE</p><h1 id="title">Activité</h1><p id="subtitle">Travaillez les idées du texte avant de comparer vos réponses.</p></header><form id="exercise" class="panel" novalidate></form><nav class="footnav"><a id="backbottom" href="./index.html">← Retour au document</a><a id="next" class="next" href="./grammaire.html">Continuer →</a></nav></main><script>
const qs=new URLSearchParams(location.search);const n=Number(qs.get("ex")||6);const anchor=qs.get("back")||({6:"photo",7:"intention",8:"part1",9:"part3"}[n]||"photo");const back="./index.html#"+encodeURIComponent(anchor);
document.querySelectorAll("#backtop,#backbottom").forEach(a=>a.href=back);
const form=document.getElementById("exercise");
const data={
6:{name:"Observer et reformuler",sub:"Observez la photo de l’article, puis lisez son titre.",html:`<h2>6 · Observez la photo de l’article (Doc. 3)</h2><label class="field"><span>a. Décrivez la situation.</span><textarea name="description" placeholder="On voit… / Il s’agit de…"></textarea></label><label class="field"><span>b. Lisez le titre de l’article et reformulez-le.</span><textarea name="reformuler" placeholder="Cet article présente…"></textarea></label><div class="actions"><button class="primary" type="submit">Comparer avec une proposition</button></div><div class="answer" id="correction"><h3>Proposition de réponse</h3><p><b>a.</b> C’est un défilé de mode. Une femme handicapée marche avec deux jambes artificielles (prothèses). Il lui manque également une main.</p><p><b>b.</b> Monde du futur : des innovations médicales peuvent aider les malades. Ces technologies permettent de retrouver une vie plus autonome.</p><p class="hint">Plusieurs reformulations sont possibles si le sens du titre est conservé.</p></div>`},
7:{name:"Comprendre la structure",sub:"Identifiez l’intention du journaliste et les deux mouvements de l’article.",html:`<h2>7 · Lisez l’article de France Info (Doc. 3)</h2><h3>a. Quelle est l’intention du journaliste ? Choisissez.</h3><div class="options"><label class="option"><input type="radio" name="intent" value="1">1. Faire des prévisions et mettre en garde contre les dérives possibles de la technologie.</label><label class="option"><input type="radio" name="intent" value="2">2. Décrire les échecs technologiques du passé et rassurer sur l’avenir.</label><label class="option"><input type="radio" name="intent" value="3">3. Décrire négativement le présent et prendre parti contre l’utilisation des technologies dans le futur.</label></div><h3>b. Identifiez les deux parties et proposez un intertitre pour chacune.</h3><div class="grid"><label class="field"><span>Partie 1 · Paragraphes 1 et 2</span><input name="part1" placeholder="Votre intertitre"></label><label class="field"><span>Partie 2 · Paragraphe 3</span><input name="part2" placeholder="Votre intertitre"></label></div><div class="actions"><button class="primary" type="submit">Valider et comparer</button></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="answer" id="correction"><h3>Corrigé</h3><p><b>a.</b> Proposition 1 : faire des prévisions et alerter sur les dérives possibles.</p><p><b>b.</b> Partie 1 : « Technologies et malades », « Prothèses du futur », « L’humain réparé ».</p><p>Partie 2 : « Dérives possibles », « Problèmes d’éthique ? ».</p><p class="hint">Ce sont des propositions d’intertitres, et non une formulation unique obligatoire.</p></div>`},
8:{name:"Repérer le lexique scientifique",sub:"Associez les parties du corps aux innovations décrites dans l’article.",html:`<h2>8 · Relisez l’article (Doc. 3)</h2><p><b>a.</b> Relevez les technologies associées aux parties du corps.</p><div class="grid" id="body-grid"></div><h3>b. Quelles innovations vous semblent les plus probables ?</h3><label class="field"><span>Justifiez brièvement votre réponse.</span><textarea name="prediction" placeholder="À mon avis…, parce que…"></textarea></label><h3>c. Repérez les composants qui permettent le fonctionnement des prothèses.</h3><label class="field"><span>Relevez au moins trois éléments dans le texte.</span><textarea name="composants" placeholder="Grâce à…"></textarea></label><div class="actions"><button class="primary" type="submit">Vérifier les associations</button></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="answer" id="correction"><h3>Proposition de correction</h3><p><b>a.</b> Cerveau : implants cérébraux ; main / jambe : prothèse bionique ; yeux : prothèse oculaire ; oreilles : prothèse auditive ; bras : prothèse bionique, bras tournevis ; genou : genou bionique ; nerf : électrodes ; squelette : exosquelette.</p><p><b>b.</b> Production libre. Le manuel cite notamment les prothèses intelligentes et les implants cérébraux.</p><p><b>c.</b> Mini-moteurs électriques, capteurs de vitesse ou de charge, microprocesseurs, algorithmes d’apprentissage des mouvements humains, électrodes connectées directement sur les nerfs.</p></div>`},
9:{name:"Observer le futur antérieur",sub:"Observez l’ordre des actions dans la dernière phrase du texte.",html:`<h2>9 · La dernière phrase de l’article</h2><blockquote style="font:25px/1.55 'Times New Roman',serif;margin:15px 0;padding:18px 22px;background:#f1f8f3;border-left:5px solid #6db48a">Reste à savoir quels progrès nous <b>déciderons</b> de mettre en place une fois que ces différentes technologies <b>auront intégré</b> notre quotidien.</blockquote><h3>a. À quel moment ces progrès seront-ils décidés ?</h3><label class="field"><span>Réponse courte</span><input name="moment" placeholder="Après…"></label><h3>b. Quelle action aura lieu d’abord ?</h3><div class="options"><label class="option"><input type="radio" name="first" value="integration">L’intégration des technologies dans la vie quotidienne</label><label class="option"><input type="radio" name="first" value="decision">La décision de mettre des progrès en place</label></div><h3>c. Associez chaque verbe à son temps.</h3><div class="grid"><label class="field"><span>déciderons</span><select name="decision"><option value="">Choisir…</option><option value="simple">futur simple</option><option value="anterieur">futur antérieur</option></select></label><label class="field"><span>auront intégré</span><select name="integration"><option value="">Choisir…</option><option value="simple">futur simple</option><option value="anterieur">futur antérieur</option></select></label></div><div class="actions"><button class="primary" type="submit">Vérifier</button></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="answer" id="correction"><h3>Comprendre l’antériorité</h3><div class="timeline"><span><b>1</b> auront intégré</span>→<span><b>2</b> déciderons</span></div><p><b>a.</b> Après l’intégration des technologies dans la vie quotidienne.</p><p><b>b.</b> D’abord l’intégration ; ensuite la décision.</p><p><b>c.</b> « déciderons » : futur simple ; « auront intégré » : futur antérieur.</p><p>Le futur antérieur marque ici un fait futur achevé avant un autre fait futur.</p></div>`}
};
const cfg=data[n]||data[6];document.getElementById("kicker").textContent="ACTIVITÉ "+n+" · COMPRÉHENSION ÉCRITE";document.getElementById("title").textContent=cfg.name;document.getElementById("subtitle").textContent=cfg.sub;form.innerHTML=cfg.html;
const next={6:7,7:8,8:9};const nextNode=document.getElementById("next");nextNode.href=next[n]?"./activites.html?ex="+next[n]+"&back="+({7:"intention",8:"part1",9:"part3"}[next[n]]):"./grammaire.html";nextNode.textContent=next[n]?"Activité "+next[n]+" →":"Passer à la grammaire →";
if(n===8){const list=[["cerveau","implants cérébraux"],["main","prothèse bionique"],["yeux","prothèse oculaire"],["oreilles","prothèse auditive"],["bras","bras bionique / bras tournevis"],["genou","genou bionique"],["nerf","électrodes connectées"],["squelette","exosquelette"]];const opts=["prothèse auditive","exosquelette","implants cérébraux","genou bionique","prothèse bionique","électrodes connectées","prothèse oculaire","bras bionique / bras tournevis"];document.getElementById("body-grid").innerHTML=list.map(([part,correct])=>`<label class="field"><span>${part}</span><select data-correct="${correct}"><option value="">Sélectionner…</option>${opts.map(v=>`<option value="${v}">${v}</option>`).join("")}</select></label>`).join("");}
form.addEventListener("submit",e=>{e.preventDefault();document.getElementById("correction").classList.add("show");const fb=document.getElementById("feedback");if(n===7){const a=form.elements.intent.value;fb.textContent=a==="1"?"Bonne réponse pour l’intention du journaliste.":a?"Relisez le dernier paragraphe : le journaliste annonce des possibilités, mais aussi leurs risques.":"Comparez les trois intentions proposées au corrigé."}if(n===8){const els=[...form.querySelectorAll("select[data-correct]")];const score=els.filter(e=>e.value===e.dataset.correct).length;fb.textContent=score+" / "+els.length+" associations correctes.";els.forEach(el=>{el.style.borderColor=el.value===el.dataset.correct?"#55a77b":"#bc7b6a";el.setAttribute("aria-invalid",el.value===el.dataset.correct?"false":"true")});}if(n===9){const good=form.elements.first.value==="integration"&&form.elements.decision.value==="simple"&&form.elements.integration.value==="anterieur";fb.textContent=good?"Bravo : vous avez repéré l’antériorité.":"Comparez les deux formes et l’ordre des actions avec le corrigé."; }document.getElementById("correction").scrollIntoView({behavior:"smooth",block:"nearest"});});</script></body></html>
