h3><p><b>a.</b> C’est un défilé de mode. Une femme handicapée marche avec deux jambes artificielles (prothèses). Il lui manque également une main.</p><p><b>b.</b> Monde du futur : des innovations médicales peuvent aider les malades. Ces technologies permettent de retrouver une vie plus autonome.</p><p class="hint">Plusieurs reformulations sont possibles si le sens du titre est conservé.</p></div>`},
7:{name:"Comprendre la structure",sub:"Identifiez l’intention du journaliste et les deux mouvements de l’article.",html:`<h2>7 · Lisez l’article de France Info (Doc. 3)</h2><h3>a. Quelle est l’intention du journaliste ? Choisissez.</h3><div class="options"><label class="option"><input type="radio" name="intent" value="1">1. Faire des prévisions et mettre en garde contre les dérives possibles de la technologie.</label><label class="option"><input type="radio" name="intent" value="2">2. Décrire les échecs technologiques du passé et rassurer sur l’avenir.</label><label class="option"><input type="radio" name="intent" value="3">3. Décrire négativement le présent et prendre parti contre l’utilisation des technologies dans le futur.</label></div><h3>b. Identifiez les deux parties et proposez un intertitre pour chacune.</h3><div class="grid"><label class="field"><span>Partie 1 · Paragraphes 1 et 2</span><input name="part1" placeholder="Votre intertitre"></label><label class="field"><span>Partie 2 · Paragraphe 3</span><input name="part2" placeholder="Votre intertitre"></label></div><div class="actions"><button class="primary" type="submit">Valider et comparer</button></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="answer" id="correction"><h3>Corrigé</h3><p><b>a.</b> Proposition 1 : faire des prévisions et alerter sur les dérives possibles.</p><p><b>b.</b> Partie 1 : « Technologies et malades », « Prothèses du futur », « L’humain réparé ».</p><p>Partie 2 : « Dérives possibles », « Problèmes d’éthique ? ».</p><p class="hint">Ce sont des propositions d’intertitres, et non une formulation unique obligatoire.</p></div>`},
8:{name:"Repérer le lexique scientifique",sub:"Associez les parties du corps aux innovations décrites dans l’article.",html:`<h2>8 · Relisez l’article (Doc. 3)</h2><p><b>a.</b> Relevez les technologies associées aux parties du corps.</p><div class="grid" id="body-grid"></div><h3>b. Quelles innovations vous semblent les plus probables ?</h3><label class="field"><span>Justifiez brièvement votre réponse.</span><textarea name="prediction" placeholder="À mon avis…, parce que…"></textarea></label><h3>c. Repérez les composants qui permettent le fonctionnement des prothèses.</h3><label class="field"><span>Relevez au moins trois éléments dans le texte.</span><textarea name="composants" placeholder="Grâce à…"></textarea></label><div class="actions"><button class="primary" type="submit">Vérifier les associations</button></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="answer" id="correction"><h3>Proposition de correction</h3><p><b>a.</b> Cerveau : implants cérébraux ; main / jambe : prothèse bionique ; yeux : prothèse oculaire ; oreilles : prothèse auditive ; bras : prothèse bionique, bras tournevis ; genou : genou bionique ; nerf : électrodes ; squelette : exosquelette.</p><p><b>b.</b> Production libre. Le manuel cite notamment les prothèses intelligentes et les implants cérébraux.</p><p><b>c.</b> Mini-moteurs électriques, capteurs de vitesse ou de charge, microprocesseurs, algorithmes d’apprentissage des mouvements humains, électrodes connectées directement sur les nerfs.</p></div>`},
9:{name:"Observer le futur antérieur",sub:"Observez l’ordre des actions dans la dernière phrase du texte.",html:`<h2>9 · La dernière phrase de l’article</h2><blockquote style="font:25px/1.55 'Times New Roman',serif;margin:15px 0;padding:18px 22px;background:#f1f8f3;border-left:5px solid #6db48a">Reste à savoir quels progrès nous <b>déciderons</b> de mettre en place une fois que ces différentes technologies <b>auront intégré</b> notre quotidien.</blockquote><h3>a. À quel moment ces progrès seront-ils décidés ?</h3><label class="field"><span>Réponse courte</span><input name="moment" placeholder="Après…"></label><h3>b. Quelle action aura lieu d’abord ?</h3><div class="options"><label class="option"><input type="radio" name="first" value="integration">L’intégration des technologies dans la vie quotidienne</label><label class="option"><input type="radio" name="first" value="decision">La décision de mettre des progrès en place</label></div><h3>c. Associez chaque verbe à son temps.</h3><div class="grid"><label class="field"><span>déciderons</span><select name="decision"><option value="">Choisir…</option><option value="simple">futur simple</option><option value="anterieur">futur antérieur</option></select></label><label class="field"><span>auront intégré</span><select name="integration"><option value="">Choisir…</option><option value="simple">futur simple</option><option value="anterieur">futur antérieur</option></select></label></div><div class="actions"><button class="primary" type="submit">Vérifier</button></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="answer" id="correction"><h3>Comprendre l’antériorité</h3><div class="timeline"><span><b>1</b> auront intégré</span>→<span><b>2</b> déciderons</span></div><p><b>a.</b> Après l’intégration des technologies dans la vie quotidienne.</p><p><b>b.</b> D’abord l’intégration ; ensuite la décision.</p><p><b>c.</b> « déciderons » : futur simple ; « auront intégré » : futur antérieur.</p><p>Le futur antérieur marque ici un fait futur achevé avant un autre fait futur.</p></div>`}
};
