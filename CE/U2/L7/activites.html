<script>
const data={"1":{"title":"Analyser une affiche","subtitle":"Doc. 1 · Observez, décrivez et interprétez.","questions":[["a.","Identifiez le titre de l’exposition, le sous-titre, le lieu et les dates.","Titre, sous-titre, lieu, dates…"],["b1.","Qui est représenté sur l’affiche ?","Commencez par : On peut voir…"],["b2.","Nommez les vêtements, les motifs et les couleurs.","Il porte… / Sa tenue est composée de…"],["c.","Les codes vestimentaires ont-ils beaucoup évolué depuis cette époque ? Expliquez.","À cette époque…, alors qu’aujourd’hui…"],["d.","Comparez avec l’évolution des codes vestimentaires dans votre culture.","Dans ma culture… / Contrairement à…"]],"responses":[["a. Informations factuelles","Titre : « À la mode ». Sous-titre : « L’art de paraître au 18e siècle ». Lieu : Musée d’arts de Nantes. Dates : du 26 novembre 2021 au 6 mars 2022."],["b. Description guidée","La figure représentée est un homme aisé du XVIIIe siècle. Il porte notamment une veste, un gilet boutonné et un pantalon ; la tenue mêle vert, doré et rose, avec des motifs floraux, de la broderie et de la dentelle blanche."],["c. Évolution des codes","Proposition : aux XVIIIe et XIXe siècles, les normes masculines des milieux aisés ont évolué vers davantage de sobriété. Une tenue très ornée, alors signe de distinction, ne joue plus exactement le même rôle aujourd’hui."],["d. Comparaison interculturelle","Production libre. Une réponse pertinente précise le contexte, décrit une évolution concrète et évite de généraliser à l’ensemble d’une culture."]],"extra":"<div class=\"extension\"><h3>Culture(s) · L’habit, le statut et le paraître</h3><p>L’exposition du Musée d’arts de Nantes montre les relations entre la peinture, le costume et les représentations sociales au XVIIIe siècle. Les habits, les portraits et la manière de se présenter étaient aussi des marqueurs de rang et de distinction.</p><p>À questionner en classe : <em>Une même tenue a-t-elle la même signification selon le siècle, le milieu social ou le genre ?</em></p><p class=\"qsource\">Pour approfondir : <a target=\"_blank\" rel=\"noopener\" href=\"https://museedartsdenantes.nantesmetropole.fr/expositions/a-la-mode/\">Musée d’arts de Nantes · À la mode</a>.</p></div>"},"2":{"title":"Comprendre une interview","subtitle":"Doc. 2 · Repérez le thème, présentez l’interviewée et décrivez sa tenue.","questions":[["a.","Quel est le thème de l’article ?","Cet article aborde…"],["b.","Qui est la personne interviewée ? À quelle occasion ?","Son nom, son métier, sa relation à la mode…"],["c.","Décrivez sa tenue. Vous semble-t-elle habituelle pour une actrice ? Expliquez.","Appuyez-vous sur des détails du texte, et nuancez votre jugement."]],"responses":[["a. Compréhension globale","L’article traite de la place des vêtements et de leur influence dans la société, notamment de la manière dont la mode exprime ou bouscule des normes."],["b. Identification","Adèle Exarchopoulos est une actrice française et une égérie de Fendi. L’entretien paraît à l’occasion de la sortie du film « Rien à foutre », dans lequel elle joue."],["c. Description et interprétation","Elle porte une doudoune ample, un jogging, des baskets, dans des tons blanc cassé, et elle transporte un sac de courses Hermès. Celui-ci contient des objets ordinaires, notamment des boîtes et des friandises. Cette juxtaposition du luxe et du quotidien déjoue certains clichés associés aux célébrités. Il faut toutefois présenter ces clichés comme des représentations sociales et non comme des règles."]],"extra":"<div class=\"extension\"><h3>Enrichissement lexical · D’après le Guide pédagogique</h3><p><span class=\"pill\">une doudoune</span> vêtement chaud, souvent matelassé ; <span class=\"pill\">jubiler</span> se réjouir vivement ; <span class=\"pill\">brouiller les pistes</span> déjouer les attentes ; <span class=\"pill\">arborer</span> porter de manière visible ; <span class=\"pill\">fortuné</span> riche ; <span class=\"pill\">transbahuter</span> transporter, trimbaler (familier) ; <span class=\"pill\">craquer pour</span> céder à une envie ; <span class=\"pill\">se jouer de</span> se moquer de certains codes.</p></div><div class=\"extension\"><h3>Culture(s) · Les marques et les représentations</h3><p><em>Hermès</em> évoque l’univers du luxe français ; <em>Fendi</em> est une maison de mode italienne. Le texte joue sur l’écart entre l’image véhiculée par ces marques et le contenu inattendu du sac.</p><p>Le film <em>Rien à foutre</em> constitue le contexte de l’entretien : il est présenté dans la leçon comme une actualité culturelle de 2022.</p></div>"},"3":{"title":"Repérer des arguments et le lexique de la mode","subtitle":"Doc. 2 · Passez de la citation à son interprétation.","questions":[["a.","D’après Adèle Exarchopoulos, « Tout est politique dans le vêtement. » Quels exemples donne-t-elle pour argumenter ses propos ?","Relevez au moins deux passages, puis expliquez le lien avec son point de vue."],["b.","Pourquoi a-t-elle choisi de représenter la maison de prêt-à-porter Fendi ?","Appuyez-vous sur les deux idées de la dernière réponse."],["c.","Relevez les mots et expressions liés au domaine de la mode.","Nommez des vêtements, des acteurs du secteur, des gammes, des codes…"]],"responses":[["a. Arguments et raisonnement","Elle explique que nos pratiques vestimentaires transmettent une image sociale et que les choix de création et de production ont une dimension collective. Elle refuse aussi de se soumettre automatiquement aux distinctions entre « bon » et « mauvais » goût, entre luxe et vêtements ordinaires, ou aux catégories vestimentaires liées au genre. Le mot « politique » renvoie ici aux rapports sociaux, aux représentations et aux valeurs, pas seulement à la politique partisane."],["b. Le choix de Fendi","Selon l’actrice, cette maison lui laisse une marge d’expression et sollicite sa créativité au lieu de la limiter à une fonction de présentation. Elle apprécie aussi la présence de mannequins aux silhouettes diversifiées, notamment des mannequins « plus-size »."],["c. Champ lexical","la mode ; les convenances ; une égérie ; le luxe ; un créateur ; une doudoune ; un jogging ; des baskets ; blanc cassé ; un sac de courses ; le bon / le mauvais goût ; le haut / le bas de gamme ; les codes masculins et féminins ; porter ; une ambassadrice ; un portant ; des pièces ; la créativité ; un défilé ; un mannequin plus-size ; une marque."]],"extra":"<div class=\"extension\"><h3>Pour aller plus loin · Expliquer plutôt que juxtaposer</h3><p>Dans l’argumentation, une citation ne suffit pas. Il faut préciser ce qu’elle démontre : par exemple, lorsque l’actrice évoque les codes masculins et féminins, elle souligne que des attentes sociales influencent la manière de s’habiller.</p><p>Question de relance : <em>Qui définit le « bon goût » ? Les conventions sociales constituent-elles toujours des règles légitimes ?</em></p></div><div class=\"extension\"><h3>Point de langue à observer</h3><p><em>Je trouve ça fou et triste qu’il y ait…</em> et <em>qu’on n’ait encore rien décidé…</em> : le jugement affectif est suivi du <strong>subjonctif</strong>. Le Guide pédagogique conseille de signaler cette structure lorsqu’un élève la repère, sans nécessairement développer toute la conceptualisation ici : elle sera reprise plus loin dans la leçon.</p></div>"}};
const params=new URLSearchParams(location.search);const n=String(params.get('ex')||'1');const a=data[n]||data['1'];const anchor=['poster','intro','ideas'].includes(params.get('back'))?params.get('back'):({1:'poster',2:'intro',3:'ideas'}[n]||'poster');

document.getElementById('extension').innerHTML=a.extra;
const next=Number(n)<3?Number(n)+1:null;document.getElementById('next').href=next?'./activites.html?ex='+next+'&back='+({2:'intro',3:'ideas'}[next]):'./index.html#ideas';document.getElementById('next').textContent=next?'Activité '+next+' →':'Retour à la lecture →';
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const fields=[...document.querySelectorAll('#form textarea')],missing=fields.filter(x=>x.value.trim().length<3);if(missing.length){const m=document.getElementById('status');m.textContent='Répondez d’abord à toutes les questions avant de comparer avec les propositions.';missing[0].focus();return}document.getElementById('status').textContent='';document.getElementById('correction').classList.add('show');document.getElementById('correction').scrollIntoView({behavior:'smooth',block:'nearest'})});
document.getElementById('clear').onclick=()=>{document.getElementById('form').reset();document.getElementById('correction').classList.remove('show');document.getElementById('status').textContent=''};
try{if(localStorage.getItem('inspire4_u2_projection')==='1')document.documentElement.classList.add('projection')}catch(e){}
</script></body></html>
