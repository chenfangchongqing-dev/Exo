<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>佛经译场 · 职司知识图谱</title>
<style>
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #fafafa; color: #1a1a1a; margin: 0; padding: 16px; }
  .kg-wrap { max-width: 780px; margin: 0 auto; }
  .kg-node { cursor: pointer; transition: opacity .15s ease-out; }
  .kg-node text { fill: #1a1a1a; }
  .kg-node[data-id="zhuyi"] text { fill: #ffffff; }
  .kg-node .kg-sub { fill: #888; }
  .kg-link { stroke: #ccc; stroke-width: 1; fill: none; }
  .kg-edge-label { fill: #aaa; font-size: 10px; }
  .kg-detail { margin-top: 8px; padding: 12px 16px; border: 1px solid #ddd; border-radius: 10px; background: #fff; min-height: 76px; }
  .kg-detail h4 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .kg-detail p { margin: 0; font-size: 14px; line-height: 22px; color: #555; }
  .kg-tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 6px; background: #eee; color: #666; margin-bottom: 6px; }
  .kg-node.dim { opacity: 0.25; }
  h2 { text-align: center; font-weight: 600; }
  .note { text-align: center; color: #888; font-size: 13px; margin-top: 4px; }
</style>
<base target="_blank">
</head>
<body>
<div class="kg-wrap">
  <h2>佛经译场 · 职司知识图谱</h2>
  <p class="note">以译主为核心：审义 → 校文 → 成文 → 润饰 → 辅助监督（点击节点查看职责）</p>
  <svg viewBox="0 0 760 540" width="100%">
    <defs>
      <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L8,4 L0,8 Z" fill="#ccc"></path>
      </marker>
    </defs>
    <g id="links"></g>
    <g id="nodes"></g>
  </svg>
  <div class="kg-detail" id="detail">
    <span class="kg-tag">点击图中节点</span>
    <h4>佛经译场 · 职司图谱</h4>
    <p>译场以"译主"为中心，围绕其运作审义、校文、成文、润饰、辅助五大类职司。点击查看各职司职责。</p>
  </div>
</div>
<script>
(function(){
  var roles = {
    zhuyi:{name:"译主", sub:"主译 · 三藏法师", tag:"核心", d:"译场最高负责人，精通梵汉双语、深通佛学。负责宣梵口译、讲解经义，如玄奘、鸠摩罗什、义净。译经的义理源头由其把关。"},
    zhengyi:{name:"证义", sub:"审义类", tag:"审义", d:"由德高望重的僧人担任，审查译文所表达的义理是否正确，防止曲解经旨，是义理层面的最高把关。"},
    zhengchan:{name:"证禅义", sub:"审义类", tag:"审义", d:"从禅学、修证角度审核经文义理，确保修行义趣不失。"},
    zhengwen:{name:"证文", sub:"校文类", tag:"校文", d:"核对梵文原文，检查译主口诵与原经是否一致，防止传抄中的讹误、漏句、错简。"},
    canyi:{name:"参译", sub:"校文类", tag:"校文", d:"对照梵汉两种文字，验证语词含义是否对应，兼审梵本音韵，是译主与笔受之间的桥梁。"},
    bizhang:{name:"度语", sub:"校文类", tag:"校文", d:"在译主口述前通译语言的辅助译员，初译阶段充当语言转换的角色。"},
    bishou:{name:"笔受", sub:"成文类", tag:"成文", d:"将译主口述的汉文即时记录成文，要求书法工整、文字功底深厚，是经文汉化的第一手记录。"},
    zhuiwen:{name:"缀文", sub:"成文类", tag:"成文", d:"将笔受的草稿整理连缀成通顺汉文，调整梵汉语序差异，使文义连贯成篇。"},
    kanding:{name:"刊定", sub:"润饰类", tag:"润饰", d:"删减冗长、补苴阙漏、润色字句，使文辞精炼典雅，符合汉文表达习惯。"},
    runwen:{name:"润文", sub:"润饰类", tag:"润饰", d:"由朝廷委派的文官（如鸿胪卿）兼任，进一步修饰文辞，确保译经的文学性与庄严性。北宋译经院定制设此职。"},
    zixue:{name:"字学", sub:"辅助类", tag:"辅助", d:"负责音韵、反切、文字审定，辨析梵汉语音差异，处理梵字音译问题。"},
    fanbai:{name:"梵呗", sub:"辅助类", tag:"辅助", d:"诵经梵呗，领众唱诵梵音陀罗尼，负责译场的音声仪轨。"},
    jianyi:{name:"监译", sub:"监督类", tag:"监督", d:"朝廷派遣的监官，代表官方监督译事，兼具行政与质量控制职能。"},
    zaxiang:{name:"供辨书手", sub:"辅助类", tag:"辅助", d:"抄写经稿、供给杂物、奔走服役，是译场运作的行政后勤力量。"}
  };
  var CX=380, CY=270;
  var pos = {
    zhengyi:[150,110], zhengchan:[290,70], zhengwen:[470,70], canyi:[610,110],
    bishou:[650,270], zhuiwen:[610,430], kanding:[470,470], runwen:[290,470],
    bizhang:[110,430], zixue:[110,270], fanbai:[150,200], jianyi:[640,200], zaxiang:[640,340]
  };
  var order=["zhengyi","zhengchan","zhengwen","canyi","jianyi","bishou","zaxiang","zhuiwen","kanding","runwen","bizhang","zixue","fanbai"];
  var gLinks=document.getElementById("links"), gNodes=document.getElementById("nodes");

  order.forEach(function(id){
    var p=pos[id];
    var line=document.createElementNS("http://www.w3.org/2000/svg","path");
    var mx=(p[0]+CX)/2, my=(p[1]+CY)/2;
    var dx=p[0]-CX, dy=p[1]-CY;
    var nx=-dy*0.12, ny=dx*0.12;
    line.setAttribute("d","M"+p[0]+","+p[1]+" Q"+(mx+nx)+","+(my+ny)+" "+CX+","+CY);
    line.setAttribute("class","kg-link");
    line.setAttribute("marker-end","url(#arr)");
    line.dataset.for=id;
    gLinks.appendChild(line);
    var lt=document.createElementNS("http://www.w3.org/2000/svg","text");
    lt.setAttribute("x",mx+nx*1.6); lt.setAttribute("y",my+ny*1.6);
    lt.setAttribute("class","kg-edge-label"); lt.setAttribute("text-anchor","middle");
    lt.textContent=roles[id].sub;
    lt.dataset.for=id;
    gLinks.appendChild(lt);
  });

  function addNode(id, x, y, r, isMain){
    var r0=roles[id];
    var g=document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","kg-node"); g.dataset.id=id; g.dataset.tag=r0.tag;
    var c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",x); c.setAttribute("cy",y); c.setAttribute("r",r);
    c.setAttribute("fill", isMain ? "#1a1a1a" : "#ffffff");
    c.setAttribute("stroke", isMain ? "#1a1a1a" : "#bbb"); c.setAttribute("stroke-width","1.5");
    g.appendChild(c);
    var t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",x); t.setAttribute("y",y+1); t.setAttribute("text-anchor","middle");
    t.setAttribute("font-size", isMain?16:13);
    t.setAttribute("font-weight","600");
    t.setAttribute("fill", isMain ? "#ffffff" : "#1a1a1a");
    t.textContent=r0.name;
    g.appendChild(t);
    if(!isMain){
      var s=document.createElementNS("http://www.w3.org/2000/svg","text");
      s.setAttribute("x",x); s.setAttribute("y",y+r+14); s.setAttribute("text-anchor","middle");
      s.setAttribute("font-size","10"); s.setAttribute("class","kg-sub");
      s.textContent=r0.tag+"类";
      g.appendChild(s);
    }
    g.addEventListener("click",function(){select(id, g);});
    gNodes.appendChild(g);
  }
  addNode("zhuyi", CX, CY, 40, true);
  order.forEach(function(id){ addNode(id, pos[id][0], pos[id][1], 30, false); });

  var detail=document.getElementById("detail");
  function select(id, g){
    var r=roles[id];
    detail.innerHTML='<span class="kg-tag">'+r.tag+'</span><h4>'+r.name+' <span style="font-weight:400;font-size:13px;color:#999">'+r.sub+'</span></h4><p>'+r.d+'</p>';
    var all=gNodes.querySelectorAll(".kg-node");
    for(var i=0;i<all.length;i++){ all[i].classList.remove("dim"); }
    var cur=g.dataset.tag;
    for(var j=0;j<all.length;j++){
      if(all[j]!==g && all[j].dataset.id!=="zhuyi" && all[j].dataset.tag!==cur){ all[j].classList.add("dim"); }
    }
    var lk=gLinks.children;
    for(var k=0;k<lk.length;k++){
      lk[k].style.opacity = (lk[k].dataset.for===id || !lk[k].dataset.for) ? "1" : "0.15";
    }
  }
})();
</script>
</body>
</html>
